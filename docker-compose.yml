version: '3.8'
services:
  db:
    image: postgres:15
    container_name: nestjslearning_postgres_db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: goodeals
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: